{% extends "_base.html" %}
{% set active = 'library' %}
{% block title %}Bulk edit — Mijnstroom{% endblock %}

{% block content %}
<h1 class="mij-page-title">Bulk edit metadata</h1>
{% if error %}<p class="mij-error">{{ error }}</p>{% endif %}
<p class="mij-muted">Editing {{ track_ids|length }} track{% if track_ids|length != 1 %}s{% endif %}.</p>

<form class="mij-form" method="post" action="/bulk-edit">
<input type="hidden" name="track_ids" value="{{ track_ids|join(',') }}">
<div class="mij-form-row">
  <label style="display:inline; text-transform:none; font-weight:400; color:#212121">
    <input type="checkbox" name="apply_title" value="1"> Apply title:
  </label>
  <input type="text" name="title" style="margin-top:6px">
</div>
<div class="mij-form-row">
  <label style="display:inline; text-transform:none; font-weight:400; color:#212121">
    <input type="checkbox" name="apply_artist" value="1"> Apply artist:
  </label>
  <input type="text" name="artist" style="margin-top:6px">
</div>
<div class="mij-form-row">
  <label style="display:inline; text-transform:none; font-weight:400; color:#212121">
    <input type="checkbox" name="apply_album" value="1"> Apply album:
  </label>
  <input type="text" name="album" style="margin-top:6px">
</div>
<div class="mij-form-row">
  <label style="display:inline; text-transform:none; font-weight:400; color:#212121">
    <input type="checkbox" name="apply_year" value="1"> Apply year:
  </label>
  <input type="text" name="year" style="margin-top:6px; width:120px">
</div>
<div class="mij-form-row">
  <label style="display:inline; text-transform:none; font-weight:400; color:#212121">
    <input type="checkbox" name="apply_genre" value="1"> Apply genre:
  </label>
  <input type="text" name="genre" style="margin-top:6px">
</div>
<div class="mij-form-actions">
  <button class="mij-btn" type="submit">Apply</button>
  <a class="mij-btn mij-btn-flat" href="/library">Cancel</a>
</div>
</form>
{% endblock %}
