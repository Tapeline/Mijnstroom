{% extends "_base.html" %}
{% set active = 'library' %}
{% block title %}Error {{ status_code }} — Mijnstroom{% endblock %}

{% block content %}
<div class="mij-error-page">
  <h1>{{ status_code }}</h1>
  <p><code>{{ error_code }}</code></p>
  {% if message %}<p>{{ message }}</p>{% endif %}
  <p class="mij-mt-16"><a class="mij-btn" href="/library">Back to library</a></p>
</div>
{% endblock %}
