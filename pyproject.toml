[project]
name = "mijnstroom"
version = "0.1.0"
description = "Self-hosted music storage and streaming service"
#readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litestar[jinja]>=2.12",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "dishka>=1.4",
    "joserfc>=1.0",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "yt-dlp>=2024.8.6",
    "dature[yaml]>=0.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
mijnstroom = "mijnstroom.bootstrap.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mijnstroom"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["mijnstroom"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
