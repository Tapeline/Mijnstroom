[project]
name = "mijnstroom"
version = "0.1.0"
description = "Self-hosted music storage and streaming service"
#readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litestar[jinja]>=2.12",
    "uvicorn[standard]>=0.30",
    "dishka>=1.4",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "yt-dlp[default]>=2024.8.6",
    "dature[yaml]>=0.1",
    "python-multipart>=0.0.9",
    "requests>=2.34.2",
    "ytdlp-jsc>=0.1.7",
    "pillow>=12.3.0",
    "music-tag>=0.4.3",
]

[project.scripts]
mijnstroom = "mijnstroom.bootstrap.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mijnstroom"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]
