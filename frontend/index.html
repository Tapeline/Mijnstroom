<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mijnstroom</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="vendored/mdl/material.min.css"/>
  <link rel="stylesheet" href="vendored/animate.min.css"/>
  <script src="vendored/require.js" data-main="js/main"></script>
</head>
<body>

<div class="mdl-layout mdl-js-layout mdl-layout--fixed-drawer mdl-layout--fixed-header">
  <header class="mdl-layout__header">
    <div class="mdl-layout__header-row">
      <div class="mdl-layout-spacer"></div>
      <button id="logout-btn" class="mdl-button mdl-js-button mdl-button--icon" title="Logout" style="display:none">
        <i class="material-icons">exit_to_app</i>
      </button>
      <div class="mdl-textfield mdl-js-textfield mdl-textfield--expandable mdl-textfield--floating-label mdl-textfield--align-right">
        <label class="mdl-button mdl-js-button mdl-button--icon" for="fixed-header-drawer-exp">
          <i class="material-icons">search</i>
        </label>
        <div class="mdl-textfield__expandable-holder">
          <input class="mdl-textfield__input" type="text" name="sample" id="fixed-header-drawer-exp">
        </div>
      </div>
    </div>
  </header>
  <div class="mdl-layout__drawer">
    <span class="mdl-layout-title">Mijnstroom</span>
    <nav class="mdl-navigation">
      <a class="mdl-navigation__link" href="#/">Home</a>
      <a class="mdl-navigation__link" href="#/tracks">Tracks</a>
      <a class="mdl-navigation__link" href="#/playlists">Playlists</a>
      <a class="mdl-navigation__link" href="#/yt">Import from YouTube</a>
      <a class="mdl-navigation__link" href="#/jobs">Jobs</a>
    </nav>
  </div>
  <main class="mdl-layout__content">
    <div class="page-content" id="app" data-transition="fadeOut" style="animation-duration: 200ms;">
    </div>
  </main>
</div>




<!--<script src="https://underscorejs.org/underscore-esm-min.js"></script>-->
<!--<script src="https://backbonejs.org/backbone-min.js"></script>-->
<!--<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>-->
<script src="vendored/mdl/material.min.js"></script>
<script>
(function () {
  var btn = document.getElementById('logout-btn');
  // Show the button (it's hidden by default; if auth is disabled, cookie won't exist anyway)
  btn.style.display = '';
  btn.addEventListener('click', function () {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/auth/logout', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function () {
      window.location.href = '/login.html';
    };
    xhr.onerror = function () {
      window.location.href = '/login.html';
    };
    xhr.send('{}');
  });
})();
</script>
</body>
</html>
