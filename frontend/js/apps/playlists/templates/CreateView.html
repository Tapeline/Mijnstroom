<div class="mdl-grid">
  <div class="mdl-cell mdl-cell--12-col">
    <h4 class="mdl-typography--display-1">Create playlist</h4>
    {{#if error}}<p style="color:#b71c1c">{{ error }}</p>{{/if}}
    <form class="js-create-form">
      <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
        <input class="mdl-textfield__input" type="text" name="title" id="c-title" required>
        <label class="mdl-textfield__label" for="c-title">Title</label>
      </div>
      <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
        <input class="mdl-textfield__input" type="text" name="artist" id="c-artist" required>
        <label class="mdl-textfield__label" for="c-artist">Artist</label>
      </div>
      <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
        <input class="mdl-textfield__input" type="text" name="genre" id="c-genre" required>
        <label class="mdl-textfield__label" for="c-genre">Genre</label>
      </div>
      <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
        <input class="mdl-textfield__input" type="number" name="year" id="c-year" required>
        <label class="mdl-textfield__label" for="c-year">Year</label>
      </div>
      <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
        <textarea class="mdl-textfield__input" name="tracks" id="c-tracks" rows="6"></textarea>
        <label class="mdl-textfield__label" for="c-tracks">Track UIDs (one per line)</label>
      </div>
      <button type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored">
        Create
      </button>
      <a class="mdl-button mdl-js-button" href="#/playlists">Cancel</a>
    </form>
  </div>
</div>
