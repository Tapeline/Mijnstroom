<div class="mdl-grid">
  <div class="mdl-cell mdl-cell--12-col">
    {{#if error}}<p style="color:#b71c1c">{{ error }}</p>{{/if}}
    <h4 class="mdl-typography--display-1">{{ title }}</h4>
    <p><strong>UID:</strong> <code>{{ uid }}</code></p>
    <p><strong>Status:</strong> {{ status }}</p>
    <button class="mdl-button mdl-js-button mdl-button--raised js-refresh">
      <i class="material-icons">refresh</i>&nbsp;Refresh
    </button>
    <a class="mdl-button mdl-js-button" href="#/jobs">Back</a>
    <h6 class="mdl-typography--subhead">Log</h6>
    <pre style="background:#fafafa;padding:8px;max-height:400px;overflow:auto;white-space:pre-wrap">{{#each log}}{{ this }}
{{/each}}</pre>
  </div>
</div>
