<div class="mdl-grid">
  <div class="mdl-cell mdl-cell--12-col">
    <h4 class="mdl-typography--display-1">Import from YouTube</h4>
    <p class="mdl-typography--body-1">Choose what you want to import:</p>
  </div>

  <div class="mdl-card mdl-shadow--2dp mdl-cell mdl-cell--6-col">
    <div class="mdl-card__title mdl-card--expand">
      <h2 class="mdl-card__title-text">Single Video</h2>
    </div>
    <div class="mdl-card__supporting-text">
      Import a single video with optional segmentation (splitting by timecodes).
    </div>
    <div class="mdl-card__actions mdl-card--border">
      <button class="mdl-button mdl-button--colored mdl-js-button mdl-js-ripple-effect js-choice-video">
        Import Video
      </button>
    </div>
  </div>

  <div class="mdl-card mdl-shadow--2dp mdl-cell mdl-cell--6-col">
    <div class="mdl-card__title mdl-card--expand">
      <h2 class="mdl-card__title-text">Playlist</h2>
    </div>
    <div class="mdl-card__supporting-text">
      Import multiple videos from a YouTube playlist.
    </div>
    <div class="mdl-card__actions mdl-card--border">
      <button class="mdl-button mdl-button--colored mdl-js-button mdl-js-ripple-effect js-choice-playlist">
        Import Playlist
      </button>
    </div>
  </div>
</div>
