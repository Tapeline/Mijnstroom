services:
  web:
    build: .
    image: mijnstroom:latest
    command: ["python", "-m", "mijnstroom.bootstrap", "web"]
    environment:
      MIJNSTROOM_DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    deploy:
      resources:
        limits:
          memory: 200M
    restart: unless-stopped

  worker:
    image: mijnstroom:latest
    command: ["python", "-m", "mijnstroom.bootstrap", "worker"]
    environment:
      MIJNSTROOM_DATA_DIR: /data
    volumes:
      - data:/data
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 100M
    restart: unless-stopped

volumes:
  data:
